<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="To-Do List web application built with Vanilla JavaScript, HTML and CSS.">
  <title>To-Do List Project</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">
  <header class="header">
    <h1>To-Do List</h1>
    <p>Веб-приложение для управления списком задач</p>
  </header>

  <main>
    <section class="card">
      <h2>Добавить задачу</h2>

      <form id="task-form" class="task-form">
        <div class="form-group">
          <label for="task-title">Название задачи</label>
          <input
                  type="text"
                  id="task-title"
                  placeholder="Например: сделать лабораторную"
          >
          <span class="error-message" id="title-error"></span>
        </div>

        <div class="form-group">
          <label for="task-category">Категория</label>
          <input
                  type="text"
                  id="task-category"
                  placeholder="Например: учеба"
          >
          <span class="error-message" id="category-error"></span>
        </div>

        <div class="form-group">
          <label for="task-priority">Приоритет</label>
          <select id="task-priority">
            <option value="low">Низкий</option>
            <option value="medium">Средний</option>
            <option value="high">Высокий</option>
          </select>
        </div>

        <button type="submit" class="btn primary-btn">Добавить задачу</button>
      </form>
    </section>

    <section class="card">
      <h2>Управление задачами</h2>

      <div class="controls">
        <div class="form-group">
          <label for="search-input">Поиск</label>
          <input
                  type="text"
                  id="search-input"
                  placeholder="Найти задачу..."
          >
        </div>

        <div class="form-group">
          <label for="status-filter">Фильтр</label>
          <select id="status-filter">
            <option value="all">Все задачи</option>
            <option value="active">Активные</option>
            <option value="completed">Выполненные</option>
          </select>
        </div>

        <div class="form-group">
          <label for="sort-select">Сортировка</label>
          <select id="sort-select">
            <option value="date">По дате создания</option>
            <option value="title">По названию</option>
            <option value="priority">По приоритету</option>
          </select>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Список задач</h2>

      <div id="task-counter" class="task-counter">
        Всего задач: 0
      </div>

      <div id="task-list" class="task-list"></div>

      <p id="empty-message" class="empty-message">
        Задач пока нет. Добавьте первую задачу.
      </p>
    </section>
  </main>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
